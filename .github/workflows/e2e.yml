name: e2e-sanitizer-lab
# Laboratorio autorizzato: prova di controllo su anthropics/claude-code-action
# Repo di proprieta' del cacciatore; preda fittizia (PROPRIETARIO.pem); nessuna
# risorsa di terzi. Canario: CACCIA-E2E-20261122.
# Modalita' REVIEW: e' quella che costruisce il prompt dai dati della PR
# (title/body/commenti/diff) passando da sanitizeContent, il codice in esame.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout della base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Review con Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          trigger: "pull_request"
          claude_args: --model claude-haiku-4-5-20251001
      - name: Alza output Claude (artefatto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: claude-output
          path: /home/runner/work/_temp/claude-execution-output.json
          if-no-files-found: warn
